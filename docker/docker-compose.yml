version: '3.8'

services:
  cosyvoice-api:
    build:
      context: ..  # Build context is project root
      dockerfile: docker/Dockerfile  # Dockerfile path relative to context
    image: cosyvoice-api:latest
    container_name: cosyvoice-api-server
    restart: unless-stopped
    # GPU support for CUDA and VLLM acceleration
#    deploy:
#      resources:
#        reservations:
#          devices:
#            - driver: nvidia
#              count: all
#              capabilities: [gpu]
    
    command:
      - "sh"
      - "-c"
      - |
        ARGS='--host 0.0.0.0 --port 9996 --model ../${MODEL_DIR:-pretrained_models/CosyVoice2-0.5B}'
        case "${LOAD_JIT}" in true) ARGS="$ARGS --load-jit";; esac
        case "${LOAD_TRT}" in true) ARGS="$ARGS --load-trt";; esac
        case "${FP16}" in true) ARGS="$ARGS --fp16";; esac
        case "${LOAD_VLLM}" in true) ARGS="$ARGS --load-vllm";; esac
        case "${NO_AUTO_VLLM}" in true) ARGS="$ARGS --no-auto-vllm";; esac
        exec conda run --no-capture-output -n cosyvoice_vllm python api/api.py $ARGS

    # Environment variables (can be overridden via .env file)
    environment:
      # Model Configuration
      - MODEL_DIR=${MODEL_DIR:-pretrained_models/CosyVoice2-0.5B}
      
      # Performance Options
      - LOAD_JIT=${LOAD_JIT:-True}
      - LOAD_TRT=${LOAD_TRT:-True}
      - FP16=${FP16:-True}
      
      # VLLM Configuration
      - LOAD_VLLM=${LOAD_VLLM:-auto}
      - NO_AUTO_VLLM=${NO_AUTO_VLLM:-}
      
    # Volume mappings
    volumes:
      # Model files - IMPORTANT: Update this path to your actual model directory
      - ${MODELS_PATH:-../pretrained_models}:/workspace/CosyVoice/pretrained_models
      
      # Logs and temporary files
      - ${LOGS_PATH:-../logs}:/workspace/CosyVoice/logs
      - ${TMP_PATH:-../tmp}:/workspace/CosyVoice/tmp
      
      # Optional: Custom configuration
      - ${CONFIG_PATH:-../config}:/workspace/CosyVoice/config

      # Cache for downloaded models/packages
      - ${CACHE_PATH:-../.cache}:/root/.cache
    
    # Port mapping - Fixed to 9996 as per container default
    ports:
      - "${API_PORT:-9996}:9996"
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9996/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Network configuration
    networks:
      - cosyvoice-network

  cosyvoice-webui:
    image: cosyvoice-api:latest  # reuse built image
    container_name: cosyvoice-webui-server
    restart: unless-stopped
    command:
      - "sh"
      - "-c"
      - |
        ARGS='--server-port 8080 --language zh --share '
        exec conda run --no-capture-output -n cosyvoice_vllm python api/webui.py $$ARGS
    environment:
      - MODEL_DIR=${MODEL_DIR:-pretrained_models/CosyVoice2-0.5B}
    volumes:
      - ${MODELS_PATH:-../pretrained_models}:/workspace/CosyVoice/pretrained_models
      - ${CACHE_PATH:-../.cache}:/root/.cache
    ports:
      - "${WEBUI_PORT:-8080}:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cosyvoice-network
    depends_on:
      - cosyvoice-api  # optional: if webui calls API internally


# Network definition
networks:
  cosyvoice-network:
    driver: bridge
    
# Optional: Shared volumes for data persistence
volumes:
  cosyvoice-logs:
    driver: local
  cosyvoice-tmp:
    driver: local
