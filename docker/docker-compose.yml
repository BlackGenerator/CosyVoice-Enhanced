version: '3.8'

services:
  cosyvoice-api:
    build:
      context: ..                # 构建上下文：项目根目录
      dockerfile: docker/Dockerfile
    image: cosyvoice-cpu:latest
    container_name: cosyvoice-api-server
    restart: unless-stopped
    command:
      - "sh"
      - "-c"
      - |
        ARGS="--host 0.0.0.0 --port ${API_PORT} --model ../${MODEL_DIR}"
        if [ "$LOAD_JIT" = "true" ] || [ "$LOAD_JIT" = "True" ] || [ "$LOAD_JIT" = "1" ]; then
          ARGS="$ARGS --load-jit"
        fi
        # 强制禁用 GPU 相关选项（即使 .env 错误）
        ARGS="$ARGS --no-trt --no-vllm --fp16 false"
        exec python api/api.py $$ARGS

    environment:
      - MODEL_DIR=${MODEL_DIR}
      - LOAD_JIT=${LOAD_JIT}
      - OMP_NUM_THREADS=4
      - PYTHONUNBUFFERED=1

    volumes:
      - ${MODELS_PATH}:/workspace/CosyVoice/pretrained_models
      - ${LOGS_PATH}:/workspace/CosyVoice/logs
      - ${TMP_PATH}:/workspace/CosyVoice/tmp
      - ${CONFIG_PATH}:/workspace/CosyVoice/config
      - ${CACHE_PATH}:/root/.cache

    ports:
      - "${API_PORT}:${API_PORT}"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - cosyvoice-net


  cosyvoice-webui:
    image: cosyvoice-cpu:latest  # 复用已构建的镜像
    container_name: cosyvoice-webui-server
    restart: unless-stopped
    command:
      - "sh"
      - "-c"
      - |
        ARGS="--host 0.0.0.0 --port ${WEBUI_PORT} --language zh --model ../${MODEL_DIR}"
        exec python api/webui.py $$ARGS

    environment:
      - MODEL_DIR=${MODEL_DIR}
      - OMP_NUM_THREADS=4

    volumes:
      - ${MODELS_PATH}:/workspace/CosyVoice/pretrained_models
      - ${CACHE_PATH}:/root/.cache

    ports:
      - "${WEBUI_PORT}:${WEBUI_PORT}"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - cosyvoice-net


networks:
  cosyvoice-net:
    driver: bridge